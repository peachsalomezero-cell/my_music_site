<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>歌单管理后台</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="wrap" style="max-width: 640px;">

  <nav class="view-tabs">
    <a href="index.html" class="view-tab">浏览歌单</a>
    <span class="view-tab is-active">管理后台</span>
  </nav>

  <header class="hero" style="padding: 40px 0 24px;">
    <span class="hero__eyebrow">Backstage / 管理后台</span>
    <h1 class="hero__title" style="font-size: clamp(28px,5vw,40px);">管理你的<em>歌单</em></h1>
    <p class="hero__subtitle">这个页面直接读写你 GitHub 仓库里的 songs.json 文件。这个链接不要分享给别人，也不要把 Token 交给任何人。</p>
  </header>

  <!-- 连接设置 -->
  <section class="admin-card" id="connectCard">
    <h2>① 连接你的仓库</h2>
    <div class="field-row">
      <div class="field">
        <label>GitHub 用户名 / 组织</label>
        <input id="cfgOwner" type="text" placeholder="例如 yourname" />
      </div>
      <div class="field">
        <label>仓库名</label>
        <input id="cfgRepo" type="text" placeholder="例如 my-music-site" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>分支</label>
        <input id="cfgBranch" type="text" value="main" />
      </div>
      <div class="field">
        <label>数据文件路径</label>
        <input id="cfgPath" type="text" value="data/songs.json" />
      </div>
    </div>
    <div class="field">
      <label>Personal Access Token（仅在本次会话中使用）</label>
      <input id="cfgToken" type="password" placeholder="github_pat_xxx 或 ghp_xxx" autocomplete="off" />
    </div>
    <div class="field">
      <label>视频上传密码（仅在本次会话中使用，用于视频存储服务鉴权）</label>
      <input id="cfgVideoPassword" type="password" placeholder="在 Cloudflare Worker 里设置的密码" autocomplete="off" />
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cfgRemember" />
      <label for="cfgRemember" style="margin:0;">在此设备的浏览器中记住这些信息（不建议在公用电脑上勾选）</label>
    </div>
    <button class="btn" id="btnConnect">连接仓库</button>
    <div id="connectStatus"></div>
  </section>

  <!-- 歌曲管理，连接成功后显示 -->
  <section class="hidden" id="manageSection">

    <section class="admin-card">
      <h2 id="formTitle">② 添加歌曲</h2>
      <div class="field-row">
        <div class="field">
          <label>歌名 *</label>
          <input id="fTitle" type="text" />
        </div>
        <div class="field">
          <label>歌手</label>
          <input id="fArtist" type="text" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>封面图片链接（选填）</label>
          <input id="fCover" type="text" placeholder="https://..." />
        </div>
        <div class="field">
          <label>跳转链接（选填，点圆形箭头图标跳转）</label>
          <input id="fUrl" type="text" placeholder="https://..." />
        </div>
      </div>
      <div class="field">
        <label>在线播放嵌入链接（选填，填了就能在网页里直接播放）</label>
        <input id="fEmbed" type="text" placeholder="例如 https://music.163.com/outchain/player?type=2&id=xxx&auto=0&height=66" />
      </div>
      <p style="font-size:12px;color:var(--text-muted);margin:-8px 0 14px;">
        怎么拿到这个链接？网易云音乐：打开歌曲页 →「分享」→「生成外链播放器」，复制里面
        <code>iframe</code> 的 src 地址；QQ音乐同理找「生成外链播放器」；YouTube：分享 → 嵌入代码，取 src；
        Spotify：分享 → 嵌入，取 src。README 里有更详细的图文说明。
      </p>
      <div class="field">
        <label>标签（选填，如 深夜循环 / 开车必放）</label>
        <input id="fTag" type="text" />
      </div>
      <div class="field">
        <label>备注（选填）</label>
        <textarea id="fNote"></textarea>
      </div>
      <div class="field">
        <label>上传本地音频文件（选填，mp3/m4a/wav 等，建议不超过 18MB）</label>
        <input id="fAudioFile" type="file" accept="audio/*" />
        <div id="fAudioCurrent" style="margin-top:6px;font-size:12px;color:var(--text-muted);"></div>
      </div>
      <div class="field">
        <label>上传本地视频文件（选填，mp4 等，建议不超过 200MB）</label>
        <input id="fVideoFile" type="file" accept="video/*" />
        <div id="fVideoCurrent" style="margin-top:6px;font-size:12px;color:var(--text-muted);"></div>
      </div>
      <button class="btn" id="btnSave">保存歌曲</button>
      <button class="btn btn--ghost hidden" id="btnCancelEdit">取消编辑</button>
      <div id="formStatus"></div>
    </section>

    <section class="admin-card">
      <h2>③ 当前歌单（<span id="songCount">0</span> 首）</h2>
      <div id="songList"></div>
    </section>

  </section>

</div>

<script>
/* ============ 基础状态 ============ */
let state = {
  owner: "", repo: "", branch: "main", path: "data/songs.json",
  token: "", videoPassword: "", sha: null, songs: [], editingId: null
};

const $ = (id) => document.getElementById(id);

/* ============ UTF-8 安全的 base64 编解码 ============ */
function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    (_, p1) => String.fromCharCode('0x' + p1)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str.replace(/\n/g, '')).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

/* ============ 音频上传相关 ============ */
const AUDIO_MAX_SIZE = 18 * 1024 * 1024; // 18MB

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function sanitizeFileName(name) {
  const cleaned = name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  return `${Date.now()}-${cleaned}`;
}

async function ghUploadAudio(file) {
  const base64 = await readFileAsBase64(file);
  const audioPath = `audio/${sanitizeFileName(file.name)}`;
  const url = `${API_BASE}/repos/${state.owner}/${state.repo}/contents/${audioPath}`;
  const res = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${state.token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: `上传音频：${file.name}`,
      content: base64,
      branch: state.branch
    })
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.message || `音频上传失败 (${res.status})`);
  }
  return audioPath;
}

/* ============ 视频上传相关 ============ */
const VIDEO_MAX_SIZE = 200 * 1024 * 1024; // 200MB，需和 Worker 里设置的一致
const VIDEO_WORKER_URL = "https://video-upload-worker.peach-salomezero.workers.dev/";
const VIDEO_PUBLIC_BASE = "https://pub-3cad2e4a7ba44829a5f78024e56c4040.r2.dev/";

async function uploadVideoToR2(file, password) {
  const res = await fetch(VIDEO_WORKER_URL, {
    method: "POST",
    headers: {
      "X-Upload-Password": password,
      "X-File-Name": file.name,
      "Content-Type": file.type || "video/mp4"
    },
    body: file
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error || `视频上传失败 (${res.status})`);
  }
  const data = await res.json();
  return VIDEO_PUBLIC_BASE + data.fileName; // 直接存完整播放链接
}

/* ============ 状态提示 ============ */
function showStatus(el, type, msg) {
  el.innerHTML = `<div class="status status--${type}">${msg}</div>`;
}
function clearStatus(el) { el.innerHTML = ""; }

/* ============ 恢复本地保存的配置 ============ */
(function restoreConfig() {
  const saved = localStorage.getItem("musicAdminConfig") || sessionStorage.getItem("musicAdminConfig");
  if (saved) {
    try {
      const cfg = JSON.parse(saved);
      $("cfgOwner").value = cfg.owner || "";
      $("cfgRepo").value = cfg.repo || "";
      $("cfgBranch").value = cfg.branch || "main";
      $("cfgPath").value = cfg.path || "data/songs.json";
    } catch (e) {}
  }
})();

/* ============ GitHub API 封装 ============ */
const API_BASE = "https://api.github.com";

async function ghGetFile() {
  const url = `${API_BASE}/repos/${state.owner}/${state.repo}/contents/${state.path}?ref=${state.branch}`;
  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${state.token}`,
      Accept: "application/vnd.github+json"
    }
  });
  if (res.status === 404) {
    return { notFound: true };
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `GitHub 返回错误 (${res.status})`);
  }
  const data = await res.json();
  const content = b64DecodeUnicode(data.content);
  return { sha: data.sha, songs: JSON.parse(content || "[]") };
}

async function ghPutFile(songs, message) {
  const url = `${API_BASE}/repos/${state.owner}/${state.repo}/contents/${state.path}`;
  const body = {
    message: message || "更新歌单",
    content: b64EncodeUnicode(JSON.stringify(songs, null, 2)),
    branch: state.branch
  };
  if (state.sha) body.sha = state.sha;

  const res = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${state.token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.message || `保存失败 (${res.status})`);
  }
  const data = await res.json();
  state.sha = data.content.sha;
}

/* ============ 连接仓库 ============ */
$("btnConnect").addEventListener("click", async () => {
  const owner = $("cfgOwner").value.trim();
  const repo = $("cfgRepo").value.trim();
  const branch = $("cfgBranch").value.trim() || "main";
  const path = $("cfgPath").value.trim() || "data/songs.json";
  const token = $("cfgToken").value.trim();
  const videoPassword = $("cfgVideoPassword").value;
  const remember = $("cfgRemember").checked;
  const statusEl = $("connectStatus");

  if (!owner || !repo || !token) {
    showStatus(statusEl, "err", "请填写用户名、仓库名和 Token。");
    return;
  }

  state = { ...state, owner, repo, branch, path, token, videoPassword };
  showStatus(statusEl, "pending", "正在连接 GitHub…");

  try {
    const result = await ghGetFile();
    if (result.notFound) {
      state.sha = null;
      state.songs = [];
      showStatus(statusEl, "ok", "已连接。仓库里还没有数据文件，保存第一首歌时会自动创建。");
    } else {
      state.sha = result.sha;
      state.songs = result.songs;
      showStatus(statusEl, "ok", `已连接，读取到 ${state.songs.length} 首歌曲。`);
    }

    if (remember) {
      localStorage.setItem("musicAdminConfig", JSON.stringify({ owner, repo, branch, path }));
    } else {
      sessionStorage.setItem("musicAdminConfig", JSON.stringify({ owner, repo, branch, path }));
    }

    $("manageSection").classList.remove("hidden");
    renderSongList();
  } catch (err) {
    showStatus(statusEl, "err", "连接失败：" + err.message + "（请检查 Token 权限、用户名/仓库名是否正确）");
  }
});

/* ============ 渲染歌曲列表 ============ */
function renderSongList() {
  const listEl = $("songList");
  $("songCount").textContent = state.songs.length;
  listEl.innerHTML = "";

  if (!state.songs.length) {
    listEl.innerHTML = `<p style="color:var(--text-muted);font-size:14px;">还没有歌曲，在上面的表单里添加第一首吧。</p>`;
    return;
  }

  state.songs.forEach((song) => {
    const row = document.createElement("div");
    row.className = "admin-song";
    row.innerHTML = `
      <div>
        <div class="admin-song__title">${escapeHtml(song.title || "未命名")}</div>
        <div class="admin-song__meta">${escapeHtml(song.artist || "")}${song.tag ? " · " + escapeHtml(song.tag) : ""}</div>
      </div>
      <div class="admin-song__actions">
        <button class="btn btn--ghost btn--sm" data-action="edit" data-id="${song.id}">编辑</button>
        <button class="btn btn--danger btn--sm" data-action="delete" data-id="${song.id}">删除</button>
      </div>
    `;
    listEl.appendChild(row);
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

/* ============ 添加 / 编辑歌曲 ============ */
$("songList").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === "edit") startEdit(id);
  if (btn.dataset.action === "delete") deleteSong(id);
});

function startEdit(id) {
  const song = state.songs.find(s => s.id === id);
  if (!song) return;
  state.editingId = id;
  $("fTitle").value = song.title || "";
  $("fArtist").value = song.artist || "";
  $("fCover").value = song.cover || "";
  $("fUrl").value = song.url || "";
  $("fEmbed").value = song.embed || "";
  $("fTag").value = song.tag || "";
  $("fNote").value = song.note || "";
  $("fAudioFile").value = "";
  $("fAudioCurrent").textContent = song.audioFile
    ? `当前已有音频文件：${song.audioFile.split("/").pop()}（重新选择文件可替换）`
    : "";
  $("fVideoFile").value = "";
  $("fVideoCurrent").textContent = song.videoFile
    ? `当前已有视频文件：${song.videoFile.split("/").pop()}（重新选择文件可替换）`
    : "";
  $("formTitle").textContent = "② 编辑歌曲";
  $("btnCancelEdit").classList.remove("hidden");
  window.scrollTo({ top: $("formTitle").getBoundingClientRect().top + window.scrollY - 20, behavior: "smooth" });
}

$("btnCancelEdit").addEventListener("click", resetForm);

function resetForm() {
  state.editingId = null;
  ["fTitle","fArtist","fCover","fUrl","fEmbed","fTag","fNote"].forEach(id => $(id).value = "");
  $("fAudioFile").value = "";
  $("fAudioCurrent").textContent = "";
  $("fVideoFile").value = "";
  $("fVideoCurrent").textContent = "";
  $("formTitle").textContent = "② 添加歌曲";
  $("btnCancelEdit").classList.add("hidden");
  clearStatus($("formStatus"));
}

$("btnSave").addEventListener("click", async () => {
  const title = $("fTitle").value.trim();
  const statusEl = $("formStatus");
  if (!title) { showStatus(statusEl, "err", "歌名不能为空。"); return; }

  const audioInput = $("fAudioFile");
  const audioFileChosen = audioInput.files && audioInput.files[0];
  if (audioFileChosen && audioFileChosen.size > AUDIO_MAX_SIZE) {
    showStatus(statusEl, "err", `音频文件太大了（${(audioFileChosen.size / 1024 / 1024).toFixed(1)}MB），建议不超过 18MB，可以用在线播放嵌入链接代替。`);
    return;
  }

  const videoInput = $("fVideoFile");
  const videoFileChosen = videoInput.files && videoInput.files[0];
  if (videoFileChosen && videoFileChosen.size > VIDEO_MAX_SIZE) {
    showStatus(statusEl, "err", `视频文件太大了（${(videoFileChosen.size / 1024 / 1024).toFixed(1)}MB），建议不超过 200MB。`);
    return;
  }
  if (videoFileChosen && !state.videoPassword) {
    showStatus(statusEl, "err", "要上传视频，需要先在①连接区域填写「视频上传密码」，然后重新点一次连接仓库。");
    return;
  }

  const songData = {
    title,
    artist: $("fArtist").value.trim(),
    cover: $("fCover").value.trim(),
    url: $("fUrl").value.trim(),
    embed: $("fEmbed").value.trim(),
    tag: $("fTag").value.trim(),
    note: $("fNote").value.trim(),
    addedAt: new Date().toISOString().slice(0, 10)
  };

  $("btnSave").disabled = true;
  try {
    if (audioFileChosen) {
      showStatus(statusEl, "pending", "正在上传音频文件…（大文件可能要等一会）");
      songData.audioFile = await ghUploadAudio(audioFileChosen);
    } else if (state.editingId) {
      // 编辑时若未重新选择文件，保留原有 audioFile
      const existing = state.songs.find(s => s.id === state.editingId);
      if (existing && existing.audioFile) songData.audioFile = existing.audioFile;
    }

    if (videoFileChosen) {
      showStatus(statusEl, "pending", "正在上传视频文件…（文件较大，可能要等一会）");
      songData.videoFile = await uploadVideoToR2(videoFileChosen, state.videoPassword);
    } else if (state.editingId) {
      // 编辑时若未重新选择文件，保留原有 videoFile
      const existing = state.songs.find(s => s.id === state.editingId);
      if (existing && existing.videoFile) songData.videoFile = existing.videoFile;
    }

    let updatedSongs;
    let commitMsg;
    if (state.editingId) {
      updatedSongs = state.songs.map(s => s.id === state.editingId ? { ...s, ...songData } : s);
      commitMsg = `更新歌曲：${title}`;
    } else {
      songData.id = String(Date.now());
      updatedSongs = [...state.songs, songData];
      commitMsg = `添加歌曲：${title}`;
    }

    showStatus(statusEl, "pending", "正在保存到 GitHub…");
    await ghPutFile(updatedSongs, commitMsg);
    state.songs = updatedSongs;
    renderSongList();
    resetForm();
    showStatus(statusEl, "ok", "已保存 ✓");
    setTimeout(() => clearStatus(statusEl), 2500);
  } catch (err) {
    showStatus(statusEl, "err", "保存失败：" + err.message);
  } finally {
    $("btnSave").disabled = false;
  }
});

async function deleteSong(id) {
  const song = state.songs.find(s => s.id === id);
  if (!song) return;
  if (!confirm(`确定要删除《${song.title}》吗？`)) return;

  const updatedSongs = state.songs.filter(s => s.id !== id);
  const statusEl = $("formStatus");
  showStatus(statusEl, "pending", "正在删除…");
  try {
    await ghPutFile(updatedSongs, `删除歌曲：${song.title}`);
    state.songs = updatedSongs;
    renderSongList();
    showStatus(statusEl, "ok", "已删除 ✓");
    setTimeout(() => clearStatus(statusEl), 2500);
  } catch (err) {
    showStatus(statusEl, "err", "删除失败：" + err.message);
  }
}
</script>

</body>
</html>
